<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="'SF Mono','Monaco','Consolas','Courier New',monospace">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #fff; }
      .layer-label { font-size: 13px; font-weight: bold; fill: #555; }
      .layer-box { fill: #f5f5f5; stroke: #333; stroke-width: 1.5; rx: 4; }
      .item-text { font-size: 12px; fill: #222; }
      .item-sub { font-size: 10px; fill: #666; }
      .arrow { stroke: #666; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #666; }
      .badge { fill: #e8e8e8; stroke: #ccc; stroke-width: 0.5; rx: 3; }
      .badge-text { font-size: 9px; fill: #444; }
      .upcoming { fill: #fef2f2; stroke: #dc2626; stroke-width: 1; rx: 4; }
      .upcoming-text { font-size: 10px; fill: #333; }
      .upcoming-label { font-size: 8px; fill: #dc2626; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="900" fill="#fff" />

  <!-- Title Bar -->
  <rect x="30" y="15" width="940" height="40" rx="4" fill="#111" />
  <text x="500" y="41" text-anchor="middle" class="title">Project Newton - System Architecture</text>

  <!-- ================================================================== -->
  <!-- LAYER 1: CLIENT (Browser) -->
  <!-- ================================================================== -->
  <text x="40" y="85" class="layer-label">CLIENT LAYER (Browser)</text>
  <rect x="30" y="95" width="560" height="110" class="layer-box" />

  <!-- Client items -->
  <rect x="45" y="105" width="160" height="35" rx="3" fill="#fff" stroke="#ccc" />
  <text x="55" y="117" class="item-text">Next.js 16 (App Router)</text>
  <text x="55" y="132" class="item-sub">React 19 + Tailwind CSS</text>

  <rect x="220" y="105" width="130" height="35" rx="3" fill="#fff" stroke="#ccc" />
  <text x="230" y="120" class="item-text">Tldraw v5 Canvas</text>
  <text x="230" y="132" class="item-sub">Infinite whiteboard</text>

  <rect x="365" y="105" width="120" height="35" rx="3" fill="#fff" stroke="#ccc" />
  <text x="375" y="120" class="item-text">ChatSidebar</text>
  <text x="375" y="132" class="item-sub">Message history</text>

  <rect x="500" y="105" width="75" height="35" rx="3" fill="#fff" stroke="#ccc" />
  <text x="510" y="120" class="item-text">Captions</text>
  <text x="510" y="132" class="item-sub">Speech text</text>

  <rect x="45" y="150" width="140" height="35" rx="3" fill="#fff" stroke="#ccc" />
  <text x="55" y="165" class="item-text">Web Speech API</text>
  <text x="55" y="177" class="item-sub">Free TTS</text>

  <rect x="200" y="150" width="110" height="35" rx="3" fill="#fff" stroke="#ccc" />
  <text x="210" y="165" class="item-text">VAD Analyzer</text>
  <text x="210" y="177" class="item-sub">Mic detection</text>

  <rect x="325" y="150" width="100" height="35" rx="3" fill="#fff" stroke="#ccc" />
  <text x="335" y="165" class="item-text">rrweb</text>
  <text x="335" y="177" class="item-sub">DOM recording</text>

  <rect x="440" y="150" width="135" height="35" rx="3" fill="#fff" stroke="#ccc" />
  <text x="450" y="165" class="item-text">Recharts</text>
  <text x="450" y="177" class="item-sub">Dashboard charts</text>

  <!-- Arrow from Client to API -->
  <line x1="310" y1="205" x2="310" y2="225" class="arrow" />
  <polygon points="305,225 310,235 315,225" class="arrow-head" />

  <!-- ================================================================== -->
  <!-- LAYER 2: API -->
  <!-- ================================================================== -->
  <text x="40" y="250" class="layer-label">API LAYER (Next.js Route Handlers)</text>
  <rect x="30" y="260" width="940" height="80" class="layer-box" />

  <text x="50" y="280" class="item-text" font-size="11">POST /api/chat-audio   -- Voice (VAD + Whisper STT) + Canvas Shapes + Text to Socratic Response</text>
  <text x="50" y="298" class="item-text" font-size="11">POST /api/chat          -- Text + Canvas Shapes to Socratic Response</text>
  <text x="50" y="316" class="item-text" font-size="11">GET  /api/skills        -- Skill tree with user mastery   |   GET /api/skills/recommendations</text>
  <text x="50" y="332" class="item-text" font-size="11">POST /api/skills/update -- Update user mastery after session</text>

  <!-- Arrow from API to LLM -->
  <line x1="310" y1="340" x2="310" y2="360" class="arrow" />
  <polygon points="305,360 310,370 315,360" class="arrow-head" />

  <!-- ================================================================== -->
  <!-- LAYER 3: LLM & INFERENCE -->
  <!-- ================================================================== -->
  <text x="40" y="385" class="layer-label">LLM AND AI INFERENCE LAYER</text>
  <rect x="30" y="395" width="940" height="95" class="layer-box" />

  <!-- Groq box -->
  <rect x="45" y="408" width="300" height="70" rx="3" fill="#fff7ed" stroke="#f97316" />
  <text x="55" y="425" class="item-text" font-weight="bold">Groq Llama-3.3-70b (Socratic Engine)</text>
  <text x="55" y="442" class="item-sub">Canvas-aware reasoning (shapes, text, geometry, diagrams)</text>
  <text x="55" y="457" class="item-sub">Struggle detection and intervention logging</text>
  <text x="55" y="472" class="item-sub">All-subject tutoring: math, science, CS, humanities</text>

  <!-- Whisper box -->
  <rect x="365" y="408" width="170" height="44" rx="3" fill="#f0fdf4" stroke="#22c55e" />
  <text x="375" y="425" class="item-text">Groq Whisper</text>
  <text x="375" y="442" class="item-sub">Speech-to-Text transcription</text>

  <!-- TTS box -->
  <rect x="555" y="408" width="190" height="44" rx="3" fill="#f0f9ff" stroke="#0ea5e9" />
  <text x="565" y="425" class="item-text">Browser SpeechSynthesis</text>
  <text x="565" y="442" class="item-sub">Text-to-Speech (free, always works)</text>

  <!-- Canvas Parser box -->
  <rect x="765" y="408" width="190" height="44" rx="3" fill="#faf5ff" stroke="#a855f7" />
  <text x="775" y="425" class="item-text">Canvas Parser</text>
  <text x="775" y="442" class="item-sub">Shape, geometry and math detection</text>

  <!-- Arrow from LLM to Data -->
  <line x1="310" y1="490" x2="310" y2="510" class="arrow" />
  <polygon points="305,510 310,520 315,510" class="arrow-head" />

  <!-- ================================================================== -->
  <!-- LAYER 4: DATA -->
  <!-- ================================================================== -->
  <text x="40" y="535" class="layer-label">DATA LAYER (Supabase / PostgreSQL)</text>
  <rect x="30" y="545" width="940" height="90" class="layer-box" />

  <text x="50" y="568" class="item-text" font-size="11">Auth (Google OAuth + Email)  ->  user_profiles (RBAC: student / teacher)</text>
  <text x="50" y="586" class="item-text" font-size="11">session_replays (rrweb events + canvas snapshots)  ->  interventions (live struggle feed)</text>
  <text x="50" y="604" class="item-text" font-size="11">skills (self-referencing tree, 30+ seeded skills)  |  user_skills (mastery 0.00 - 1.00)</text>
  <text x="50" y="622" class="item-text" font-size="11">skill_prerequisites (DAG for learning dependencies)  ->  Realtime subscriptions (live dashboard)</text>

  <!-- ================================================================== -->
  <!-- GOD-LEVEL UPGRADES SECTION -->
  <!-- ================================================================== -->
  <text x="30" y="680" font-size="13" font-weight="bold" fill="#dc2626">GOD-LEVEL UPGRADES (Roadmap)</text>

  <!-- GL1 -->
  <rect x="30" y="695" width="295" height="60" class="upcoming" />
  <text x="45" y="713" class="upcoming-label">UPCOMING</text>
  <text x="45" y="728" class="upcoming-text" font-weight="bold">1. Multimodal Canvas Vision Engine</text>
  <text x="45" y="745" class="upcoming-text">Canvas PNG + Shapes sent to Gemini 2.0 Flash Vision</text>

  <!-- GL2 -->
  <rect x="345" y="695" width="295" height="60" class="upcoming" />
  <text x="360" y="713" class="upcoming-label">UPCOMING</text>
  <text x="360" y="728" class="upcoming-text" font-weight="bold">2. Low-Latency Voice-to-Voice Pipeline</text>
  <text x="360" y="745" class="upcoming-text">Streaming WebSocket with Cartesia / Deepgram TTS</text>

  <!-- GL3 -->
  <rect x="660" y="695" width="310" height="60" class="upcoming" />
  <text x="675" y="713" class="upcoming-label">UPCOMING</text>
  <text x="675" y="728" class="upcoming-text" font-weight="bold">3. Interactive AI Canvas Generator</text>
  <text x="675" y="745" class="upcoming-text">AI draws geometry, graphs and highlights in red</text>

  <!-- GL4 -->
  <rect x="30" y="765" width="295" height="60" class="upcoming" />
  <text x="45" y="783" class="upcoming-label">UPCOMING</text>
  <text x="45" y="798" class="upcoming-text" font-weight="bold">4. Audio-Synchronized Replays</text>
  <text x="45" y="815" class="upcoming-text">WebRTC audio synced frame-by-frame with rrweb</text>

  <!-- GL5 -->
  <rect x="345" y="765" width="295" height="60" class="upcoming" />
  <text x="360" y="783" class="upcoming-label">UPCOMING</text>
  <text x="360" y="798" class="upcoming-text" font-weight="bold">5. Multiplayer Socratic Classroom</text>
  <text x="360" y="815" class="upcoming-text">Tldraw collaborative sync (Yjs) + live student roster</text>

  <!-- GL6 -->
  <rect x="660" y="765" width="310" height="60" class="upcoming" />
  <text x="675" y="783" class="upcoming-label">UPCOMING</text>
  <text x="675" y="798" class="upcoming-text" font-weight="bold">6. Gamified 3D Knowledge Graph</text>
  <text x="675" y="815" class="upcoming-text">3D skill constellation with mastery node particle beams</text>

  <!-- Tech stack bar at bottom -->
  <rect x="30" y="840" width="940" height="45" rx="4" fill="#fafafa" stroke="#ddd" />
  <text x="50" y="858" class="item-sub" font-size="10">Next.js 16 + React 19  |  Tailwind CSS  |  Tldraw v5  |  Supabase (Auth + Postgres + Realtime)</text>
  <text x="50" y="874" class="item-sub" font-size="10">Groq Llama-3.3-70b  |  Groq Whisper  |  Web Speech API  |  rrweb  |  Recharts  |  Framer Motion</text>
</svg>