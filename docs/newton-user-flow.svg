<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="800" height="950">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Itim&amp;display=swap');
      text { font-family: 'Itim', 'Patrick Hand', 'Caveat', cursive; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="950" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="65" fill="#1e1e2e"/>
  <text x="400" y="30" text-anchor="middle" font-size="22" font-weight="400" fill="#ffffff">Project Newton</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#8888aa">Socratic AI Tutoring Platform -- Student Interaction Flow</text>

  <!-- Step 1: Student enters classroom -->
  <rect x="250" y="95" width="300" height="45" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="123" text-anchor="middle" font-size="16" fill="#4338ca">Student enters classroom</text>

  <line x1="400" y1="140" x2="400" y2="175" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Interact -->
  <rect x="240" y="178" width="320" height="45" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="206" text-anchor="middle" font-size="16" fill="#4338ca">Draws on canvas / types / speaks</text>

  <line x1="400" y1="223" x2="400" y2="258" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: API -->
  <rect x="240" y="260" width="320" height="45" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="288" text-anchor="middle" font-size="16" fill="#7c3aed">Parse canvas + transcribe audio</text>

  <line x1="400" y1="305" x2="400" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Socratic Engine -->
  <rect x="210" y="342" width="380" height="45" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="370" text-anchor="middle" font-size="16" fill="#d97706">Socratic Engine (Groq Llama 3.3-70B)</text>

  <line x1="400" y1="387" x2="400" y2="420" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Struggling? -->
  <polygon points="400,427 510,470 400,513 290,470" fill="#fff3bf" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="465" text-anchor="middle" font-size="15" fill="#92400e">Struggling?</text>
  <text x="400" y="482" text-anchor="middle" font-size="11" fill="#92400e">(is_struggling flag)</text>

  <!-- YES -->
  <line x1="290" y1="470" x2="160" y2="470" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="250" y="453" width="45" height="18" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="272" y="466" text-anchor="middle" font-size="13" fill="#ef4444">YES</text>

  <!-- NO -->
  <line x1="510" y1="470" x2="640" y2="470" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="503" y="453" width="40" height="18" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="523" y="466" text-anchor="middle" font-size="13" fill="#16a34a">NO</text>

  <!-- Path A: Socratic questioning -->
  <line x1="160" y1="470" x2="160" y2="535" stroke="#ef4444" stroke-width="2"/>
  <rect x="30" y="535" width="260" height="65" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="560" text-anchor="middle" font-size="16" fill="#dc2626">Socratic questioning</text>
  <text x="160" y="580" text-anchor="middle" font-size="12" fill="#991b1b">AI asks guiding questions to help</text>
  <text x="160" y="595" text-anchor="middle" font-size="12" fill="#991b1b">student find their own error</text>

  <!-- Path B: Teach concept -->
  <line x1="640" y1="470" x2="640" y2="535" stroke="#22c55e" stroke-width="2"/>
  <rect x="510" y="535" width="260" height="65" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="560" text-anchor="middle" font-size="16" fill="#16a34a">Teach concept clearly</text>
  <text x="640" y="580" text-anchor="middle" font-size="12" fill="#166534">Explain with analogies and</text>
  <text x="640" y="595" text-anchor="middle" font-size="12" fill="#166534">write shapes onto the canvas</text>

  <line x1="160" y1="600" x2="160" y2="635" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="600" x2="640" y2="635" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Post-path boxes -->
  <rect x="30" y="635" width="260" height="50" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="658" text-anchor="middle" font-size="14" fill="#c2410c">Log intervention to DB</text>
  <text x="160" y="676" text-anchor="middle" font-size="11" fill="#9a3412">INSERT into interventions table</text>

  <rect x="510" y="635" width="260" height="50" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="658" text-anchor="middle" font-size="14" fill="#c2410c">Output to canvas and TTS</text>
  <text x="640" y="676" text-anchor="middle" font-size="11" fill="#9a3412">Speak response with captions</text>

  <!-- Converge -->
  <line x1="290" y1="660" x2="400" y2="660" stroke="#555" stroke-width="2"/>
  <line x1="510" y1="660" x2="400" y2="660" stroke="#555" stroke-width="2"/>
  <line x1="400" y1="660" x2="400" y2="700" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Session over? -->
  <polygon points="400,707 490,748 400,789 310,748" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="746" text-anchor="middle" font-size="14" fill="#6d28d9">Session over?</text>

  <!-- NO loop -->
  <line x1="310" y1="748" x2="100" y2="748" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="100" y1="748" x2="100" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="100" y1="200" x2="238" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowLoop)"/>
  <text x="88" y="480" text-anchor="middle" font-size="12" fill="#94a3b8" transform="rotate(-90, 88, 480)">Loop continues until ended</text>

  <!-- YES -->
  <line x1="490" y1="748" x2="640" y2="748" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="479" y="733" width="32" height="18" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="495" y="746" text-anchor="middle" font-size="13" fill="#16a34a">YES</text>

  <!-- End actions -->
  <line x1="640" y1="748" x2="640" y2="795" stroke="#22c55e" stroke-width="2"/>
  <rect x="480" y="795" width="320" height="65" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="818" text-anchor="middle" font-size="15" fill="#16a34a">Save replay and update skills</text>
  <text x="640" y="838" text-anchor="middle" font-size="11" fill="#166534">rrweb events saved to Supabase, mastery recalculated</text>
  <text x="640" y="853" text-anchor="middle" font-size="11" fill="#166534">Streak and badge check, next skill recommended</text>

  <!-- Teacher path -->
  <rect x="30" y="730" width="180" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="753" text-anchor="middle" font-size="14" fill="#dc2626">Teacher dashboard</text>
  <text x="120" y="771" text-anchor="middle" font-size="11" fill="#991b1b">Live feed + concept heatmap</text>

  <line x1="160" y1="685" x2="120" y2="685" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="120" y1="685" x2="120" y2="728" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>

  <rect x="30" y="800" width="180" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="823" text-anchor="middle" font-size="14" fill="#dc2626">Replay viewer</text>
  <text x="120" y="841" text-anchor="middle" font-size="11" fill="#991b1b">Watch full session playback</text>

  <line x1="120" y1="780" x2="120" y2="798" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Footer -->
  <rect x="0" y="910" width="800" height="40" fill="#f8fafc"/>
  <text x="400" y="935" text-anchor="middle" font-size="12" fill="#94a3b8">Built with Next.js 16 | Tldraw v5 | Groq SDK | Supabase | rrweb | Recharts</text>
</svg>
